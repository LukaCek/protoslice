name: ProtoSlice v2 baseline and engine
on:
  pull_request:
    paths:
      - 'app.py'
      - 'versions/**'
      - 'engine/**'
      - 'tests/baseline/**'
      - 'tests/engine/**'
      - 'tests/fixtures/**'
      - 'docs/v2/**'
      - '.github/workflows/v2-baseline.yml'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run baseline and engine tests without OrcaSlicer
        run: python -m pytest -q tests/baseline/ tests/engine/
